name: Publish manual staging preview (not live domain)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dante-media-pages-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Build project-path staging site with noindex
        env:
          DANTE_STAGING: '1'
          DANTE_BASE_PATH: /Dante-Media
        run: python build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages staging
        id: deployment
        uses: actions/deploy-pages@v4
