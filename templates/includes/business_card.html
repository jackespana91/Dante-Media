<article class="business-card" data-category="{{ b.category }}" data-brand="{{ b.icon|lower }}" data-reveal>
  <div class="business-card-content">
    <p class="business-category">{{ b.label }}</p>
    <h3>{{ b.name }}</h3>
    <p class="business-description">{{ b.description }}</p>
    <div class="business-meta"><span class="business-status">{{ b.status }}</span></div>
    {% if b.url %}
    <a class="text-link business-link" href="{{ b.url }}" {% if b.url.startswith('http') %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ 'Explore' if not b.url.startswith('http') else 'Visit' }} {{ b.name }} <span aria-hidden="true">↗</span></a>
    {% else %}
    <a class="text-link business-link" href="/contact/#group-enquiries">Enquire about {{ b.name }} <span aria-hidden="true">↗</span></a>
    {% endif %}
  </div>
</article>
