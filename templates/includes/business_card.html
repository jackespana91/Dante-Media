<article class="business-card" data-category="{{ b.category }}" data-reveal><div class="business-card-top"><div class="sigil {{ b.accent }}" aria-hidden="true">{{ b.icon }}</div><span class="chip">{{ b.note }}</span></div><h3>{{ b.name }}</h3><p>{{ b.description }}</p><div class="meta"><span>{{ b.label }}</span><span>{{ b.status }}</span></div>{% if b.url %}<a class="text-link" style="margin-top:17px;align-self:flex-start" href="{{ b.url }}" {% if b.url.startswith('http') %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ 'Learn more' if not b.url.startswith('http') else 'Visit website' }} <span aria-hidden="true">↗</span></a>{% endif %}</article>
